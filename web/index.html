<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sovereign Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hidden">
    <div class="panel">
      <span class="corner tl">❖</span>
      <span class="corner tr">❖</span>
      <span class="corner bl">❖</span>
      <span class="corner br">❖</span>

      <header class="masthead">
        <button id="btn-close" class="close-btn" title="Take your leave">✕</button>
        <div class="wallet" id="wallet-display"></div>
        <div class="mast-rule"><span class="rule"></span><span class="orn">❦</span><span class="rule"></span></div>
        <h1>Sovereign&nbsp;Bank</h1>
        <div class="mast-sub">Incorporated 1896 · Deposits Insured by the Government Fund</div>
        <div id="branch-name" class="branch-name">—</div>
      </header>

      <div class="body">
        <nav class="sidenav">
          <div class="nav-head">Index</div>
          <button class="nav-btn active" data-view="overview">Accounts</button>
          <button class="nav-btn" data-view="transfer">Wire &amp; Pay</button>
          <button class="nav-btn" data-view="open">New Account</button>
          <div class="nav-foot">All banking is conducted<br>in person, at the counter.<br><br>— The Management</div>
        </nav>
        <main id="view" class="view"></main>
      </div>
    </div>
    <div id="toasts"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
