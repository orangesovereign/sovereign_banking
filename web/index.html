<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sovereign Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hidden">
    <div class="panel" id="teller-panel">

      <header class="masthead">
        <div class="brand">
          <img class="monogram" src="icons/png/paper/monogram.png" alt="" draggable="false">
          <div class="brand-rule"></div>
          <div class="brand-text">
            <h1>Sovereign Bank</h1>
            <div class="est">
              <svg class="est-arrow" viewBox="0 0 90 8"><path d="M0 4 H82 M82 4 l-7 -3.2 M82 4 l-7 3.2" stroke="currentColor" stroke-width="1" fill="none"/></svg>
              <span>Est. 1896</span>
              <svg class="est-arrow flip" viewBox="0 0 90 8"><path d="M0 4 H82 M82 4 l-7 -3.2 M82 4 l-7 3.2" stroke="currentColor" stroke-width="1" fill="none"/></svg>
            </div>
            <div class="motto">In Service to Prosperity</div>
          </div>
        </div>
      </header>

      <div class="main">
        <aside class="col col-left">
          <div class="col-head boxed">Your Accounts</div>
          <div id="cash-card"></div>
          <div id="acct-cards" class="acct-cards"></div>
          <div class="networth">
            <div class="nw-label">Total Net Worth</div>
            <div class="nw-value" id="networth">$0.00</div>
            <svg class="orn" viewBox="0 0 120 10"><path d="M5 5 H50 M70 5 H115" stroke="currentColor" stroke-width="1"/><path d="M60 1.5 L64 5 L60 8.5 L56 5 Z" fill="currentColor"/></svg>
          </div>
        </aside>

        <section class="col col-center">
          <h2 id="center-title">Transaction Ledger</h2>
          <svg class="orn center-orn" viewBox="0 0 120 10"><path d="M5 5 H50 M70 5 H115" stroke="currentColor" stroke-width="1"/><path d="M60 1.5 L64 5 L60 8.5 L56 5 Z" fill="currentColor"/></svg>
          <div class="ledger-filters">
            <div class="lf-left">
              <label for="sel-account">Account:</label>
              <select id="sel-account"></select>
            </div>
            <select id="sel-filter"></select>
          </div>
          <table class="ledger">
            <thead>
              <tr><th>Date</th><th>Description</th><th>Type</th><th class="num">Amount</th><th class="num">Balance</th></tr>
            </thead>
            <tbody id="ledger-rows"></tbody>
          </table>
          <div class="ledger-foot">
            <span class="lf-rule"></span>
            <button class="pager" id="pg-newer" title="Newer entries">‹</button>
            <span id="ledger-count">—</span>
            <button class="pager" id="pg-older" title="Older entries">›</button>
            <span class="lf-rule"></span>
          </div>
        </section>

        <aside class="col col-right">
          <div class="col-head">Bank Actions</div>
          <div id="actions" class="actions"></div>
          <div class="col-head spaced">Branch Information</div>
          <div id="branch-info" class="branch-info"></div>
        </aside>
      </div>

      <footer class="quickbar">
        <div class="qa-label">
          <span>Quick Actions</span>
          <svg class="orn gold" viewBox="0 0 120 10"><path d="M5 5 H50 M70 5 H115" stroke="currentColor" stroke-width="1"/><path d="M60 1.5 L64 5 L60 8.5 L56 5 Z" fill="currentColor"/></svg>
        </div>
        <div id="quick-actions" class="quick-actions"></div>
        <button class="exit" id="btn-close"><span class="keycap">ESC</span><span>Exit</span></button>
      </footer>

    </div>

    <div class="panel hidden" id="admin-panel">
      <header class="masthead">
        <div class="brand">
          <img class="monogram" src="icons/png/paper/monogram.png" alt="" draggable="false">
          <div class="brand-rule"></div>
          <div class="brand-text">
            <h1>Ledger Office</h1>
            <div class="est">
              <svg class="est-arrow" viewBox="0 0 90 8"><path d="M0 4 H82 M82 4 l-7 -3.2 M82 4 l-7 3.2" stroke="currentColor" stroke-width="1" fill="none"/></svg>
              <span>Administration</span>
              <svg class="est-arrow flip" viewBox="0 0 90 8"><path d="M0 4 H82 M82 4 l-7 -3.2 M82 4 l-7 3.2" stroke="currentColor" stroke-width="1" fill="none"/></svg>
            </div>
            <div class="motto" id="admin-actor">—</div>
          </div>
        </div>
      </header>

      <div class="main">
        <aside class="col col-left">
          <div class="col-head boxed">Money Supply</div>
          <div id="admin-supply"></div>
        </aside>

        <section class="col col-center">
          <h2>Accounts</h2>
          <svg class="orn center-orn" viewBox="0 0 120 10"><path d="M5 5 H50 M70 5 H115" stroke="currentColor" stroke-width="1"/><path d="M60 1.5 L64 5 L60 8.5 L56 5 Z" fill="currentColor"/></svg>
          <div class="ledger-filters">
            <div class="lf-left">
              <label for="adm-search">Search:</label>
              <input type="text" id="adm-search" placeholder="number, owner id, or name">
            </div>
            <button class="btn slim" id="adm-search-go">Look Up</button>
          </div>
          <div id="admin-accounts"></div>
        </section>

        <aside class="col col-right">
          <div class="col-head">Loan Applications</div>
          <div id="admin-loans"></div>
          <div class="col-head spaced">Branch Reserves</div>
          <div id="admin-reserves"></div>
        </aside>
      </div>

      <footer class="quickbar">
        <div class="qa-label">
          <span>Operations</span>
          <svg class="orn gold" viewBox="0 0 120 10"><path d="M5 5 H50 M70 5 H115" stroke="currentColor" stroke-width="1"/><path d="M60 1.5 L64 5 L60 8.5 L56 5 Z" fill="currentColor"/></svg>
        </div>
        <div class="quick-actions" id="admin-quick"></div>
        <button class="exit" id="admin-close"><span class="keycap">ESC</span><span>Exit</span></button>
      </footer>
    </div>

    <div id="modal-root" class="hidden"></div>
    <div id="toasts"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
