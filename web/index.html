<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sovereign Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hidden">
    <div class="panel">
      <header class="masthead">
        <div class="mast-left">
          <h1>Sovereign Bank</h1>
          <div id="branch-name" class="branch-name">—</div>
        </div>
        <div class="mast-right">
          <div class="wallet" id="wallet-display"></div>
          <button id="btn-close" class="close-btn" title="Leave the counter">✕</button>
        </div>
      </header>

      <div class="body">
        <nav class="sidenav">
          <button class="nav-btn active" data-view="overview">Accounts</button>
          <button class="nav-btn" data-view="transfer">Wire &amp; Pay</button>
          <button class="nav-btn" data-view="open">New Account</button>
          <div class="nav-foot">Est. 1896 · Member of the<br>Government Insurance Fund</div>
        </nav>
        <main id="view" class="view"></main>
      </div>
    </div>
    <div id="toasts"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
